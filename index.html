<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SMS Bomber - by HASSY Seo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #0b1120 0%, #1a2639 100%);
            padding: 1.5rem;
        }

        .card {
            max-width: 480px;
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border-radius: 2.5rem;
            padding: 2.2rem 2rem 2rem;
            box-shadow: 0 25px 50px -8px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header .icon {
            font-size: 2.8rem;
            color: #f97316;
            background: rgba(249, 115, 22, 0.12);
            width: 70px;
            height: 70px;
            line-height: 70px;
            border-radius: 50%;
            margin: 0 auto 0.75rem;
            border: 1px solid rgba(249, 115, 22, 0.25);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(249, 115, 22, 0); }
            100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
        }

        .header h1 {
            color: #ffffff;
            font-size: 1.9rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .header h1 span {
            background: linear-gradient(135deg, #f97316, #fb923c);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header .sub {
            color: #94a3b8;
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            color: #e2e8f0;
            font-weight: 500;
            font-size: 0.9rem;
            margin-bottom: 0.4rem;
        }

        .form-group label i {
            margin-right: 8px;
            color: #f97316;
            width: 18px;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 1.2rem;
            padding: 0.2rem 0.2rem 0.2rem 1.2rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: all 0.25s ease;
        }

        .input-wrapper:focus-within {
            border-color: #f97316;
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.25);
        }

        .input-wrapper .prefix {
            color: #94a3b8;
            font-weight: 500;
            font-size: 0.95rem;
            margin-right: 6px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.85rem 0.8rem;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 500;
        }

        .input-wrapper input::placeholder {
            color: #64748b;
        }

        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }

        .btn-bomb {
            width: 100%;
            padding: 1rem;
            background: linear-gradient(135deg, #f97316, #ea580c);
            border: none;
            border-radius: 1.8rem;
            font-size: 1.2rem;
            font-weight: 700;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 6px 18px rgba(249, 115, 22, 0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            position: relative;
        }

        .btn-bomb:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(249, 115, 22, 0.45);
        }

        .btn-bomb:active {
            transform: scale(0.97);
        }

        .btn-bomb.loading {
            background: linear-gradient(135deg, #64748b, #475569);
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-bomb .btn-text {
            transition: all 0.3s ease;
        }

        .btn-bomb .btn-loader {
            display: none;
            align-items: center;
            gap: 10px;
        }

        .btn-bomb.loading .btn-text {
            display: none;
        }

        .btn-bomb.loading .btn-loader {
            display: flex;
        }

        .btn-bomb .spinner {
            width: 22px;
            height: 22px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #responseBox {
            margin-top: 1.5rem;
            padding: 1rem 1.2rem;
            border-radius: 1.2rem;
            background: rgba(0, 0, 0, 0.35);
            border-left: 4px solid #f97316;
            color: #e2e8f0;
            font-size: 0.9rem;
            min-height: 50px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        #responseBox i {
            color: #f97316;
            font-size: 1.1rem;
        }

        .footer {
            margin-top: 2.2rem;
            padding-top: 1.2rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            text-align: center;
        }

        .footer .dev {
            color: #64748b;
            font-size: 0.8rem;
        }

        .footer .dev strong {
            color: #e2e8f0;
        }

        .btn-group {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-top: 0.8rem;
            background: rgba(255, 255, 255, 0.04);
            padding: 0.5rem 1.2rem 0.5rem 1.5rem;
            border-radius: 3rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .btn-group span {
            color: #94a3b8;
            font-size: 0.85rem;
        }

        .btn-group a {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #25D366;
            color: #fff;
            padding: 0.4rem 1.2rem 0.4rem 1rem;
            border-radius: 2.5rem;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3);
        }

        .btn-group a:hover {
            transform: scale(1.04);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.45);
        }

        @media (max-width: 440px) {
            .card {
                padding: 1.5rem 1.2rem;
            }
            .header h1 {
                font-size: 1.5rem;
            }
            .btn-bomb {
                font-size: 1rem;
                padding: 0.85rem;
            }
        }

        .request-info {
            margin-top: 0.5rem;
            padding: 0.5rem 0.8rem;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 0.8rem;
            font-size: 0.7rem;
            color: #94a3b8;
            display: none;
            font-family: monospace;
            word-break: break-all;
        }

        .request-info.show {
            display: block;
        }

        .request-info span {
            color: #f97316;
        }
    </style>
</head>
<body>

<div class="card">

    <div class="header">
        <div class="icon">
            <i class="fas fa-bomb"></i>
        </div>
        <h1>SMS <span>Bomber</span></h1>
        <p class="sub">by <strong>HASSY Seo</strong></p>
    </div>

    <form id="bomberForm">
        <div class="form-group">
            <label for="phoneInput"><i class="fas fa-phone-alt"></i> Phone Number</label>
            <div class="input-wrapper">
                <span class="prefix">+92</span>
                <input type="text" id="phoneInput" placeholder="3xxxxxxxxx" value="" required />
            </div>
        </div>

        <div class="form-group">
            <label for="countInput"><i class="fas fa-hashtag"></i> Count</label>
            <div class="input-wrapper">
                <input type="number" id="countInput" placeholder="5" value="5" min="1" max="100" />
            </div>
        </div>

        <button type="submit" class="btn-bomb" id="bombBtn">
            <span class="btn-text">
                <i class="fas fa-skull-crossbones"></i> Launch Bomb
            </span>
            <span class="btn-loader">
                <span class="spinner"></span>
                <span id="btnStatus">Sending...</span>
            </span>
        </button>
    </form>

    <div id="responseBox">
        <i class="fas fa-circle-info"></i>
        <span id="responseText">Ready</span>
    </div>

    <div class="request-info" id="requestInfo">
        📤 <span id="reqDisplay"></span>
    </div>

    <div class="footer">
        <div class="dev">
            Developed by <strong> HASSY Seo</strong>
        </div>
        <div class="btn-group">
            <span><i class="fas fa-users"></i> Join Group</span>
            <a href="https://www.tiktok.com/@hsn_0001?_r=1&_t=ZS-9A23yVKcIXH">
                <i class="fab fa-tiktok"></i> TikTok 
            </a>
        </div>
    </div>

</div>

<script>
    (function() {
        "use strict";

        const form = document.getElementById('bomberForm');
        const phoneInput = document.getElementById('phoneInput');
        const countInput = document.getElementById('countInput');
        const bombBtn = document.getElementById('bombBtn');
        const responseText = document.getElementById('responseText');
        const responseIcon = document.getElementById('responseBox').querySelector('i');
        const btnStatus = document.getElementById('btnStatus');
        const requestInfo = document.getElementById('requestInfo');
        const reqDisplay = document.getElementById('reqDisplay');

        // API Endpoint
        const API_BASE = 'https://smsbombapi-ten.vercel.app/api/send';

        function setResponse(message, type = 'info') {
            const iconMap = {
                'success': 'fa-check-circle',
                'error': 'fa-circle-exclamation',
                'warning': 'fa-triangle-exclamation',
                'info': 'fa-circle-info'
            };
            const colorMap = {
                'success': '#4ade80',
                'error': '#f87171',
                'warning': '#fbbf24',
                'info': '#60a5fa'
            };
            responseIcon.className = `fas ${iconMap[type] || 'fa-circle-info'}`;
            responseIcon.style.color = colorMap[type] || '#60a5fa';
            responseText.textContent = message;
            document.getElementById('responseBox').style.borderLeftColor = colorMap[type] || '#60a5fa';
        }

        function showRequestInfo(text) {
            reqDisplay.textContent = text;
            requestInfo.classList.add('show');
            setTimeout(() => {
                requestInfo.classList.remove('show');
            }, 4000);
        }

        // Validate phone (10 digits, starts with 3)
        function validatePhone(phone) {
            const cleaned = phone.replace(/\D/g, '');
            return cleaned.length === 10 && /^[3-9]/.test(cleaned);
        }

        // Main send function with CORS proxy
        async function sendBomb(phone, count) {
            try {
                const cleanPhone = phone.replace(/\D/g, '');
                const url = `${API_BASE}?phone=${cleanPhone}&count=${count}`;
                
                console.log('[SEND]', url);
                showRequestInfo(`phone=${cleanPhone}&count=${count}`);

                // Try direct fetch with CORS proxy fallback
                let response;
                try {
                    response = await fetch(url, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                } catch (corsError) {
                    console.warn('CORS error, trying proxy...');
                    // Fallback: Use corsproxy.io
                    const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(url)}`;
                    response = await fetch(proxyUrl, {
                        method: 'GET',
                        headers: {
                            'Accept': 'application/json'
                        }
                    });
                }

                const data = await response.json();
                console.log('[RESPONSE]', data);

                if (response.ok && data.status === 'success') {
                    setResponse(`✅ ${data.message || 'Bomb started!'}`, 'success');
                } else {
                    const errMsg = data.message || data.error || 'API returned error';
                    setResponse(`❌ ${errMsg}`, 'error');
                }

            } catch (error) {
                console.error('[ERROR]', error);
                setResponse(`❌ Error: ${error.message}`, 'error');
            } finally {
                // Reset button
                bombBtn.classList.remove('loading');
                bombBtn.innerHTML = `
                    <span class="btn-text">
                        <i class="fas fa-skull-crossbones"></i> Launch Bomb
                    </span>
                    <span class="btn-loader">
                        <span class="spinner"></span>
                        <span id="btnStatus">Sending...</span>
                    </span>
                `;
            }
        }

        // Form submit handler
        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            
            console.log('[SUBMIT] Form submitted');

            let phone = phoneInput.value.trim();
            const countStr = countInput.value.trim();
            const count = parseInt(countStr, 10);

            // Validate
            if (!phone) {
                setResponse('Enter a phone number', 'warning');
                return;
            }

            phone = phone.replace(/^(\+92|92|0)/, '');
            if (!validatePhone(phone)) {
                setResponse('Use 10 digits starting with 3', 'error');
                return;
            }

            if (!countStr || isNaN(count) || count < 1) {
                setResponse('Count must be at least 1', 'warning');
                return;
            }
            if (count > 100) {
                setResponse('Max count is 100', 'error');
                return;
            }

            // Show loading with animation
            bombBtn.classList.add('loading');
            btnStatus.textContent = 'Bombing...';
            setResponse(`📤 Sending: ${phone} × ${count}`, 'info');

            // Wait 2 seconds (animation)
            await new Promise(resolve => setTimeout(resolve, 2000));

            // Send API
            await sendBomb(phone, count);
        });

        setResponse('Ready', 'info');
        console.log('[READY] SMS Bomber loaded');

    })();
</script>

</body>
  </html>
